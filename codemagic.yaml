workflows:
  ios-workflow:
    name: Too Rich iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Too Rich CI"
    environment:
      groups:
        - supabase_credentials
      vars:
        BUNDLE_ID: "com.kaif.toorich"
        XCODE_WORKSPACE: "ios/TooRichApp.xcworkspace"
        XCODE_SCHEME: "TooRichApp"
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kaif.toorich
    scripts:
      - name: Generate .env from secrets
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set build number
        script: |
          cd ios && agvtool new-version -all 1
      - name: Build ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - kaif39882@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true