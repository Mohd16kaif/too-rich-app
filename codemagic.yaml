workflows:
  ios-workflow:
    name: Too Rich iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.kaif.toorich"
        XCODE_WORKSPACE: "TooRichApp.xcworkspace"
        XCODE_SCHEME: "TooRichApp"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - kaif39882@gmail.com
        notify:
          success: true
          failure: true